# ===========================================================================
# Snagarr - build, publish, and dispatch a deploy bump to homelab-stacks.
#
# Triggers:
#   push to main            -> :latest, :edge, :sha-<short-sha>
#   push of a v* git tag    -> additionally the bare semver X.Y.Z
#   manual (workflow_dispatch)
#
# On every push to main the workflow dispatches a repository_dispatch
# (type: snagarr-image) to Emkraan/homelab-stacks. The snagarr-bump.yml
# workflow there bumps the image tag in media/docker-compose.yml and fires
# the hq_mediamanager Portainer webhook. Secrets never leave GitHub
# Actions - they are safe in a public repo CI because secret access is
# restricted to the default branch.
#
# Image: ghcr.io/emkraan/snagarr
# ===========================================================================

name: build-and-deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: emkraan/snagarr

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags and metadata
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          APP_VERSION="v$(tr -d '[:space:]' < VERSION 2>/dev/null || echo '0.0.0')"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          TAGS="${IMAGE}:latest"
          TAGS="${TAGS},${IMAGE}:edge"
          TAGS="${TAGS},${IMAGE}:sha-${SHORT_SHA}"

          # When a v* git tag triggers the build, also publish the bare semver.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${GITHUB_REF_NAME}" ]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${IMAGE}:${SEMVER}"
          fi

          {
            echo "tags=${TAGS}"
            echo "app_version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

          echo "Publishing tags:"
          echo "${TAGS}" | tr ',' '\n'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Snagarr
            org.opencontainers.image.description=Self-hosted hunter that continuously searches Sonarr, Radarr, Lidarr, Readarr, and Whisparr for missing and upgradable media and triggers downloads on a schedule.
            org.opencontainers.image.source=https://github.com/Emkraan/snagarr
            org.opencontainers.image.url=https://github.com/Emkraan/snagarr
            org.opencontainers.image.documentation=https://github.com/Emkraan/snagarr
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ steps.meta.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Mint deploy-bot app token (homelab-stacks scope)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v3
        id: hs-token
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          repositories: homelab-stacks

      - name: Dispatch snagarr-image bump to homelab-stacks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.hs-token.outputs.token }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          gh api repos/Emkraan/homelab-stacks/dispatches \
            --method POST \
            --field event_type=snagarr-image \
            --field "client_payload[image]=${REGISTRY}/${IMAGE_NAME}" \
            --field "client_payload[tag]=sha-${SHORT_SHA}"
