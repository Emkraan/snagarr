name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No em dashes
        run: |
          python3 - << 'PYEOF'
          import sys, pathlib
          DASHES = '\u2013\u2014\u2015'
          SKIP = {'.git', '.github', 'node_modules', '__pycache__', 'dist', 'build', '.venv'}
          found = False
          for path in sorted(pathlib.Path('.').rglob('*.md')):
              if any(p in SKIP for p in path.parts):
                  continue
              try:
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              except Exception as e:
                  print(f'::warning::Could not read {path}: {e}')
                  continue
              for lineno, line in enumerate(lines, 1):
                  if any(ch in line for ch in DASHES):
                      print(f'::error file={path},line={lineno}::Em/en dash found. Use a hyphen, comma, or colon.')
                      found = True
          if found:
              sys.exit(1)
          PYEOF

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

  ci:
    name: ci
    needs: [pytest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
