<!-- Mobile top bar + backdrop (shell): shown <=900px; hamburger opens the
     sidebar as an off-canvas drawer. Included on both index and /user. -->
<div class="mobile-topbar">
    <button class="mt-burger" id="mtBurger" type="button" aria-label="Open navigation"
            aria-controls="sidebar" aria-expanded="false">
        <i class="fas fa-bars"></i>
    </button>
    <div class="mt-brand">
        <i class="fas fa-dragon" aria-hidden="true"></i>
        <span class="mt-title">Snagarr</span>
    </div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

<div class="sidebar" id="sidebar" data-sidebar>
    <div class="sidebar-top-line"></div>
    <div class="logo-container">
        <span class="logo" aria-label="Snagarr"><i class="fas fa-dragon"></i></span>
        <div class="logo-text">
            <h1>Snagarr</h1>
            <span class="logo-sub">Missing &amp; upgrade hunter</span>
        </div>
    </div>

    <nav class="nav-menu" data-nav>
        <!-- Core: the hunt workflow -->
        <div class="nav-group">
            <div class="nav-group-title">Core</div>
            <a href="/" class="nav-item" id="homeNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-gauge-high"></i></div>
                <span>Dashboard</span>
            </a>
            <a href="/#apps" class="nav-item" id="appsNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-plug"></i></div>
                <span>Connections</span>
            </a>
            <a href="#scheduling" class="nav-item" id="schedulingNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-calendar-alt"></i></div>
                <span>Scheduling</span>
            </a>
        </div>

        <!-- Activity: what the hunter did -->
        <div class="nav-group">
            <div class="nav-group-title">Activity</div>
            <a href="/#logs" class="nav-item" id="logsNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-list-alt"></i></div>
                <span>Logs</span>
            </a>
            <a href="/#history" class="nav-item" id="historyNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-clock-rotate-left"></i></div>
                <span>History</span>
            </a>
        </div>

        <!-- System: administration -->
        <div class="nav-group">
            <div class="nav-group-title">System</div>
            <a href="/#settings" class="nav-item" id="settingsNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-sliders"></i></div>
                <span>Settings</span>
            </a>
            <a href="/admin" class="nav-item" id="adminNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-shield-halved"></i></div>
                <span>Admin Hub</span>
            </a>
            <a href="/api/docs" class="nav-item" id="apiNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-code"></i></div>
                <span>API</span>
            </a>
            <a href="/user" class="nav-item" id="userNav">
                <span class="nav-rail"></span>
                <div class="nav-icon-wrapper"><i class="fas fa-user-gear"></i></div>
                <span>Account</span>
            </a>
        </div>
    </nav>

    <!-- Bottom-left standard: account row + brand / version / build / GitHub -->
    <div class="sidebar-foot">
        <!-- Signed-in account (ids kept so new-main.js keeps wiring name + logout) -->
        <div class="acct-row" id="userInfoContainer">
            <span class="acct-avatar" id="acctAvatar" aria-hidden="true">U</span>
            <span class="acct-meta">
                <span class="acct-name" id="username">User</span>
                <span class="acct-role">Signed in</span>
            </span>
            <a href="#" id="logoutLink" class="acct-logout" title="Sign out" aria-label="Sign out">
                <i class="fas fa-arrow-right-from-bracket"></i>
            </a>
        </div>

        <!-- Emkraan brand tag (family standard, every build) + version/build + GitHub -->
        <div class="brand-foot">
            <img class="emkraan-mark" src="/static/logo/emkraan.png" alt="" width="18" height="18">
            <span class="brand-meta">
                <span class="brand-line">Built by <b>Emkraan</b></span>
                <span class="brand-build mono"><span id="snagarrVersion">v0.1.0</span> &middot; <span id="snagarrBuild">dev</span></span>
            </span>
            <a class="brand-gh" href="https://github.com/Emkraan/snagarr" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </div>
</div>

<style>
    /* ---- Cobalt Elevated sidebar (tokenized; no off-brand hues) ---- */
    .sidebar {
        width: var(--sidebar-w);
        height: 100vh;
        background: linear-gradient(180deg, var(--surface-1) 0%, var(--bg-canvas) 100%);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        z-index: 1000;
        flex-shrink: 0;
        overflow: hidden;                 /* only the nav scrolls; brand + tag stay pinned */
        position: relative;
    }
    .sidebar-top-line {
        position: absolute; top: 0; left: 0; right: 0; height: 1px; z-index: 2;
        background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
        opacity: .55;
    }

    .logo-container {
        display: flex; align-items: center; gap: 12px;
        padding: 18px 18px 16px; position: relative;
    }
    .logo {
        width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 120% at 30% 20%, var(--surface-4), var(--surface-inset));
        box-shadow: 0 0 0 1px var(--accent-border), 0 6px 18px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .logo i { font-size: 22px; color: var(--accent-bright); filter: drop-shadow(0 1px 4px rgba(36,134,185,.55)); }
    .logo-text { display: flex; flex-direction: column; min-width: 0; }
    .logo-container h1 {
        font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0;
        color: var(--text-primary); letter-spacing: var(--track-title); line-height: 1.1;
    }
    .logo-sub {
        font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase;
        color: var(--text-dim); margin-top: 3px;
    }

    .nav-menu {
        display: flex; flex-direction: column; padding: 6px 12px 12px; flex: 1 1 auto; min-height: 0; gap: 2px;
        overflow-y: auto;
    }
    .nav-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
    .nav-group-title {
        font-size: 10px; font-weight: 600; font-family: var(--font-sans);
        text-transform: uppercase; letter-spacing: var(--track-caps);
        color: var(--accent-bright); opacity: .82; padding: 14px 10px 6px;
    }
    .nav-group:first-child .nav-group-title { padding-top: 4px; }

    .nav-item {
        position: relative; display: flex; align-items: center; gap: 11px;
        padding: 9px 11px; border-radius: var(--radius-sm);
        color: var(--text-secondary); text-decoration: none; font-size: 13.5px; font-weight: 500;
        border: 1px solid transparent; white-space: nowrap;
        transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
                    transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease);
    }
    .nav-item .nav-rail {
        position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0;
        background: var(--accent-bright); box-shadow: 0 0 8px var(--accent-glow);
        opacity: 0; transform: scaleY(.3); transform-origin: center;
        transition: opacity var(--t) var(--ease-out), transform var(--t) var(--ease-spring);
    }
    .nav-icon-wrapper {
        width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        border-radius: var(--radius-sm); background: var(--surface-3);
        box-shadow: inset 0 0 0 1px var(--border-hair);
        transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
    }
    .nav-icon-wrapper i { font-size: 14px; color: var(--text-secondary); transition: color var(--t-fast) var(--ease); }
    .nav-item span { transition: color var(--t-fast) var(--ease); }

    .nav-item:hover { background: var(--accent-veil); color: var(--text-primary); }
    .nav-item:hover .nav-icon-wrapper i { color: var(--accent-bright); }
    .nav-item:active { transform: scale(.985); }

    .nav-item.active {
        background: var(--accent-dim); color: var(--text-primary); font-weight: 600;
        border-color: var(--accent-border); box-shadow: var(--elev-1);
    }
    .nav-item.active .nav-rail { opacity: 1; transform: scaleY(1); }
    .nav-item.active .nav-icon-wrapper { background: var(--surface-4); }
    .nav-item.active .nav-icon-wrapper i { color: var(--accent-bright); }
    @media (hover: hover) and (pointer: fine) {
        .nav-item:hover { transform: translateX(2px); }
    }

    /* ---- Bottom-left footer: account + brand/version/build/github ---- */
    .sidebar-foot {
        flex-shrink: 0; padding: 10px 12px 12px;
        border-top: 1px solid var(--border-hair);
        display: flex; flex-direction: column; gap: 8px;
    }

    /* Account row */
    .acct-row {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 9px; border-radius: var(--radius-sm);
        background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border-hair);
    }
    .acct-avatar {
        width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
        display: grid; place-items: center;
        font-family: var(--font-display); font-size: 13px; font-weight: 600;
        color: var(--text-inverse); letter-spacing: 0;
        background: var(--surface-4); box-shadow: var(--elev-0), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .acct-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.25; }
    .acct-name {
        font-size: 13px; font-weight: 600; color: var(--text-primary);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .acct-role {
        font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim); margin-top: 1px;
    }
    .acct-logout {
        flex-shrink: 0; width: 28px; height: 28px; display: grid; place-items: center;
        border-radius: var(--radius-sm); color: var(--text-dim); text-decoration: none; font-size: 13px;
        transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
    }
    .acct-logout:hover { background: var(--danger-veil, rgba(239,68,68,.12)); color: var(--danger-bright, #f87171); }
    .acct-logout:focus-visible { outline: none; box-shadow: var(--focus-ring-tight); }

    /* Brand + version/build + GitHub */
    .brand-foot { display: flex; align-items: center; gap: 9px; padding: 2px 4px 0; }
    .emkraan-mark {
        width: 18px; height: 18px; display: block; flex-shrink: 0; object-fit: contain;
        filter: drop-shadow(0 1px 4px rgba(0,0,0,.5));
    }
    .brand-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.3; }
    .brand-line {
        font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps);
        text-transform: uppercase; color: var(--text-dim);
    }
    .brand-line b { color: var(--accent-bright); font-weight: 700; }
    .brand-build {
        font-size: 10.5px; color: var(--text-dim); margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .brand-build #snagarrBuild { color: var(--text-secondary); }
    .brand-gh {
        flex-shrink: 0; width: 26px; height: 26px; display: grid; place-items: center;
        border-radius: var(--radius-sm); color: var(--text-dim); text-decoration: none; font-size: 15px;
        transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
                    transform var(--t-fast) var(--ease-out);
    }
    .brand-gh:hover { background: var(--accent-veil); color: var(--accent-bright); }
    .brand-gh:focus-visible { outline: none; box-shadow: var(--focus-ring-tight); }
    @media (hover: hover) and (pointer: fine) { .brand-gh:hover { transform: translateY(-1px); } }

    /* IdP photo avatar (falls back to hashed initials when absent). */
    .acct-avatar.has-photo { color: transparent; box-shadow: var(--elev-0), inset 0 0 0 1px var(--border-hair); }

    /* RBAC: read-only members lose the admin nav items + mutating controls.
       The backend (enforce_rbac) is the real boundary; this is a clean UX. */
    body.role-member #appsNav,
    body.role-member #schedulingNav,
    body.role-member #settingsNav,
    body.role-member #adminNav,
    body.role-member #apiNav,
    body.role-member #dashboardResetStats,
    body.role-member #clearLogsButton,
    body.role-member #clearHistoryButton { display: none !important; }

    /* ---- Mobile drawer shell (<=900px) ------------------------------------
       The full-label sidebar becomes an off-canvas drawer that slides in over a
       dimmed backdrop. These rules live here (not cobalt.css) so they load AFTER
       cobalt.css and beat this file's own base .sidebar rule for position/width/
       z-index. Desktop (>900px) is untouched. ---------------------------------- */
    @media (max-width: 900px) {
        .mobile-topbar {
            display: flex; position: fixed; top: 0; left: 0; right: 0;
            height: var(--mobile-topbar-h); z-index: 60; align-items: center; gap: 12px; padding: 0 12px;
            background: rgba(11, 18, 32, .86);
            backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
            border-bottom: 1px solid var(--border-subtle); box-shadow: var(--elev-1);
        }
        .mt-burger {
            width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center;
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--surface-2); color: var(--text-primary); font-size: 18px; cursor: pointer;
            transition: background-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
        }
        .mt-burger:active { transform: scale(.95); }
        .mt-burger:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .mt-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .mt-brand i { color: var(--accent-bright); font-size: 18px; flex-shrink: 0; }
        .mt-title {
            font-family: var(--font-display); font-size: 15px; font-weight: 700;
            color: var(--text-primary); letter-spacing: var(--track-title);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* .sidebar => off-canvas drawer (full labels retained). */
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            height: 100vh; height: 100dvh;
            width: 288px; max-width: 86vw; min-width: 0;
            z-index: 80; transform: translateX(-100%);
            transition: transform var(--dur-slow) var(--ease-out);
            box-shadow: none;
        }
        .sidebar.open { transform: translateX(0); box-shadow: var(--elev-4); }

        /* Dimmed backdrop behind the drawer. */
        .sidebar-backdrop {
            display: block; position: fixed; inset: 0; z-index: 70;
            background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none;
            transition: opacity var(--t-slow) var(--ease-out);
        }
        .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }

        /* Content clears the fixed bar; body scroll locks while the drawer is open. */
        .main-content { padding-top: var(--mobile-topbar-h); }
        body.drawer-locked { overflow: hidden; }

        /* Drawer-foot tap targets. */
        .acct-logout, .brand-gh { width: 40px; height: 40px; }
    }
</style>

<script>
    // Highlight the nav item for the current hash (SPA) or path (standalone pages).
    function setActiveNavItem() {
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => item.classList.remove('active'));

        if (window.location.pathname === '/user') {
            document.getElementById('userNav')?.classList.add('active');
            return;
        }
        if (window.location.pathname === '/admin') {
            document.getElementById('adminNav')?.classList.add('active');
            return;
        }
        if (window.location.pathname === '/api/docs') {
            document.getElementById('apiNav')?.classList.add('active');
            return;
        }

        let currentHash = window.location.hash || '#home';
        const selector = currentHash === '#home' ? '#homeNav' :
                         currentHash === '#history' ? '#historyNav' :
                         currentHash === '#logs' ? '#logsNav' :
                         currentHash === '#apps' ? '#appsNav' :
                         currentHash === '#cleanuperr' ? '#appsNav' :
                         currentHash === '#settings' ? '#settingsNav' :
                         currentHash === '#scheduling' ? '#schedulingNav' : '#homeNav';
        document.querySelector(selector)?.classList.add('active');
    }
    document.addEventListener('DOMContentLoaded', setActiveNavItem);
    window.addEventListener('hashchange', setActiveNavItem);

    // Bottom-left footer: account avatar, version/build, and a self-contained
    // logout so it works on every page that includes the sidebar (index + /user),
    // independent of which page controller is loaded.
    (function () {
        var nameEl = document.getElementById('username');
        var avEl = document.getElementById('acctAvatar');

        var roleEl = document.querySelector('.acct-row .acct-role');

        function paintAvatar(t) {
            // A real IdP photo (has-photo) always wins over hashed initials.
            if (!avEl || avEl.classList.contains('has-photo')) return;
            t = (t || 'U').trim() || 'U';
            avEl.textContent = (t.charAt(0) || 'U').toUpperCase();
            var h = 0;
            for (var i = 0; i < t.length; i++) { h = (h * 31 + t.charCodeAt(i)) >>> 0; }
            avEl.style.background = 'hsl(' + (h % 360) + ', 44%, 38%)';
        }

        paintAvatar(nameEl ? nameEl.textContent : 'User');
        if (nameEl) {
            new MutationObserver(function () { paintAvatar(nameEl.textContent); })
                .observe(nameEl, { childList: true, characterData: true, subtree: true });
        }

        // Identity from the IdP: full name, photo, and RBAC role. Idempotent
        // alongside new-main.js (which also sets #username to name||username).
        fetch('/api/user/info').then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                if (!d) return;
                var display = d.name || d.username || 'User';
                if (nameEl) nameEl.textContent = display;
                if (avEl && d.picture) {
                    avEl.classList.add('has-photo');
                    avEl.textContent = '';
                    avEl.style.background = 'center/cover no-repeat url("' + String(d.picture).replace(/"/g, '%22') + '")';
                } else {
                    paintAvatar(display);
                }
                if (roleEl) roleEl.textContent = d.role === 'member' ? 'Member' : 'Administrator';
                // Read-only members: hide admin nav + controls (backend also 403s).
                document.body.classList.toggle('role-member', d.role === 'member');
            }).catch(function () {});

        // Version + build number.
        fetch('/api/version').then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                if (!d) return;
                var v = document.getElementById('snagarrVersion');
                var b = document.getElementById('snagarrBuild');
                if (v && d.version) { v.textContent = 'v' + String(d.version).replace(/^v/, ''); }
                if (b && d.build) { b.textContent = String(d.build).slice(0, 7); }
            }).catch(function () {});

        // Logout: sidebar owns it; new-main.js defers via the data-bound guard.
        var lo = document.getElementById('logoutLink');
        if (lo && !lo.dataset.bound) {
            lo.dataset.bound = '1';
            lo.addEventListener('click', function (e) {
                e.preventDefault();
                fetch('/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
                    .then(function () { window.location.href = '/login'; })
                    .catch(function () { window.location.href = '/login'; });
            });
        }
    })();

    // Mobile drawer: hamburger toggles the off-canvas sidebar. Self-contained and
    // idempotent (dataset.bound), so it is safe on index.html and /user alike.
    (function () {
        var sidebar = document.getElementById('sidebar');
        var burger = document.getElementById('mtBurger');
        var backdrop = document.getElementById('sidebarBackdrop');
        if (!sidebar || !burger || !backdrop || burger.dataset.bound) return;
        burger.dataset.bound = '1';

        function open() {
            sidebar.classList.add('open');
            backdrop.hidden = false;
            requestAnimationFrame(function () { backdrop.classList.add('open'); });
            burger.setAttribute('aria-expanded', 'true');
            document.body.classList.add('drawer-locked');
        }
        function close() {
            sidebar.classList.remove('open');
            backdrop.classList.remove('open');
            burger.setAttribute('aria-expanded', 'false');
            document.body.classList.remove('drawer-locked');
            // Hide the backdrop after its fade so it stops catching taps.
            setTimeout(function () { if (!sidebar.classList.contains('open')) backdrop.hidden = true; }, 260);
        }
        function toggle() { sidebar.classList.contains('open') ? close() : open(); }

        burger.addEventListener('click', toggle);
        backdrop.addEventListener('click', close);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && sidebar.classList.contains('open')) close();
        });
        // Close after tapping any nav link or the sign-out control (SPA + real nav).
        sidebar.querySelectorAll('.nav-item, .acct-logout').forEach(function (a) {
            a.addEventListener('click', close);
        });
        // Auto-close if the viewport grows back to desktop.
        window.addEventListener('resize', function () {
            if (window.innerWidth > 900 && sidebar.classList.contains('open')) close();
        });
    })();
</script>
